name: Auditoría de tickets — alerta

# Red de seguridad: barre cada 15 minutos y avisa por WhatsApp los casos
# nuevos. No hay hook en el momento de emitir porque el backend vive en otro
# repositorio, así que este cron es lo que cubre ese hueco.
#
# Secretos que necesita (Settings > Secrets and variables > Actions):
#   MONGODB_URI, KV_REST_API_URL, KV_REST_API_TOKEN,
#   WATI_API_ENDPOINT, WATI_TOKEN, AUDIT_ALERT_NUMBERS
# Variables opcionales:
#   AUDIT_ALERT_TEMPLATE, AUDIT_ALERT_MAX_HORA, AUDIT_ALERT_ENABLED,
#   AUDIT_DASHBOARD_URL

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      horas:
        description: "Ventana a revisar, en horas"
        required: false
        default: "6"
      dry_run:
        description: "true = no envía ni guarda estado"
        required: false
        default: "false"

concurrency:
  group: auditoria-alerta
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet pymongo

      # Solo forma y longitud: nunca el valor. Sirve para saber cuál secreto
      # quedó mal pegado sin tener que ir probando de a uno.
      - name: Verificar secretos
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          WATI_API_ENDPOINT: ${{ secrets.WATI_API_ENDPOINT }}
          WATI_TOKEN: ${{ secrets.WATI_TOKEN }}
          AUDIT_ALERT_NUMBERS: ${{ secrets.AUDIT_ALERT_NUMBERS }}
        run: |
          python3 - <<'PY'
          import hashlib, os, sys

          # Huella irreversible: permite comparar contra el valor de origen sin
          # exponerlo. Si la huella no coincide, lo guardado no es lo esperado.
          def huella(v):
              return hashlib.sha256(v.encode()).hexdigest()[:10] if v else "—"

          ESPERADAS = {
              "MONGODB_URI": ("cd35002699", 93),
              "WATI_API_ENDPOINT": ("630de3f05d", 39),
              "WATI_TOKEN": ("474be5281a", 170),
          }

          def revisar(nombre, esperado=None, minimo=1):
              v = os.environ.get(nombre, "")
              limpio = v.strip()
              problemas = []
              if not limpio:
                  problemas.append("vacío o no existe")
              else:
                  if len(v) != len(limpio):
                      problemas.append("tiene espacios o saltos de línea alrededor")
                  if limpio[0] in "\"'" or limpio[-1] in "\"'":
                      problemas.append("quedó con comillas")
                  if limpio.upper().startswith(nombre + "="):
                      problemas.append("incluye el nombre de la variable")
                  if esperado and not limpio.startswith(esperado):
                      problemas.append(f"debería empezar por {esperado}")
                  if len(limpio) < minimo:
                      problemas.append(f"muy corto ({len(limpio)} caracteres)")
              esp = ESPERADAS.get(nombre)
              if esp and limpio:
                  if huella(limpio) != esp[0]:
                      problemas.append(
                          f"NO es el valor de tu .env (esperaba huella {esp[0]} "
                          f"y {esp[1]} caracteres; llegó {huella(limpio)})")
              estado = "OK  " if not problemas else "MAL "
              print(f"  {estado}{nombre:22s} {len(limpio):4d} caracteres  "
                    f"huella={huella(limpio)}"
                    + ("\n         -> " + "; ".join(problemas) if problemas else ""))
              return not problemas

          print("Revisión de secretos (solo forma, nunca el valor):")
          ok = [
              revisar("MONGODB_URI", "mongodb", 20),
              revisar("KV_REST_API_URL", "https://", 20),
              revisar("KV_REST_API_TOKEN", None, 30),
              revisar("WATI_API_ENDPOINT", "https://", 15),
              revisar("WATI_TOKEN", None, 30),
              revisar("AUDIT_ALERT_NUMBERS", None, 10),
          ]
          nums = [n for n in os.environ.get("AUDIT_ALERT_NUMBERS", "").replace(";", ",").split(",") if n.strip()]
          print(f"       destinatarios detectados: {len(nums)}")
          for n in nums:
              n = n.strip()
              aviso = "" if n.isdigit() else "  <- debe ser solo dígitos, sin + ni espacios"
              print(f"         {n[:3]}...{n[-2:]} ({len(n)} dígitos){aviso}")
          if not all(ok):
              print("\nCorrige los que dicen MAL y vuelve a correr. Nada se envió.")
              sys.exit(1)
          print("\nTodos los secretos tienen buena forma.")
          PY

      - name: Revisar y alertar
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          WATI_API_ENDPOINT: ${{ secrets.WATI_API_ENDPOINT }}
          WATI_TOKEN: ${{ secrets.WATI_TOKEN }}
          AUDIT_ALERT_NUMBERS: ${{ secrets.AUDIT_ALERT_NUMBERS }}
          AUDIT_ALERT_TEMPLATE: ${{ vars.AUDIT_ALERT_TEMPLATE }}
          AUDIT_ALERT_MAX_HORA: ${{ vars.AUDIT_ALERT_MAX_HORA }}
          AUDIT_ALERT_ENABLED: ${{ vars.AUDIT_ALERT_ENABLED }}
          AUDIT_DASHBOARD_URL: ${{ vars.AUDIT_DASHBOARD_URL }}
          HORAS: ${{ inputs.horas || '6' }}
          DRY: ${{ inputs.dry_run }}
        run: |
          extra=""
          if [ "$DRY" = "true" ]; then extra="--dry-run"; fi
          python3 tools/ticket_audit/alerta.py --horas "$HORAS" $extra
